<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Abriendo Maestro AI Studio</title>
<!--
  ============================================================================
  PAGINA PUENTE. Sin dependencias y sin estado.

  Lo UNICO que hace: leer un vale del FRAGMENTO de la direccion, pedirle al
  navegador que abra el programa local registrado para ese tipo de enlace, y
  despues quitarse de en medio.

  Por que el fragmento (#) y no la consulta (?): el navegador NUNCA envia el
  fragmento al servidor. El alojamiento no ve el vale, no lo registra y no
  puede registrarlo. La consulta se compara ENTERA contra una lista cerrada
  de cadenas exactas (ver CONSULTAS): ninguna de las admitidas lleva un vale,
  asi que un vale no puede viajar en la consulta ni por descuido.

  Esta pagina no tiene identificadores de elementos, ni titulos, ni rutas, ni
  sesion, ni puerto, ni nombres del proyecto. No carga nada de fuera y no
  guarda nada. Un vale solo decide QUE ficha se abre: no aprueba, no rechaza,
  no genera y no enciende la tarjeta grafica.

  ---------------------------------------------------------------------------
  POR QUE CAMBIA EL MINIMO, que es la correccion de esta version.

  La version anterior exigia 1500 ms entre el lanzamiento y el cierre. Medido
  en el ordenador del duenyo el 30 de octubre de 2026:

      en frio     1820, 3647, 4127 ms
      EN CALIENTE  983, 791, 862, 987, 835, 928 ms   (media 897)

  Y el caso real es el caliente: cuando la pantalla local ya esta abierta de
  un clic anterior, el lanzador no la levanta -- la reutiliza -- y llama al
  navegador inmediatamente despues de importar. Asi que el unico
  `visibilitychange` que llega lo hace sobre 1,0-1,2 s, POR DEBAJO del minimo,
  y el minimo lo descartaba. La pestanya se quedaba abierta hasta que el
  duenyo cambiaba de ventana a mano, lo que producia un SEGUNDO evento ya
  pasado el minimo: entonces si se cerraba. Eso es exactamente lo que se
  observo.

  El minimo baja a 250 ms, que sigue dejando un margen de mas del triple
  sobre la medicion mas rapida. Y no hace falta mas suelo que ese, porque lo
  que de verdad protege la confirmacion de Chrome es otra cosa:

  LA CONDICION DE OCULTA. La ventana con la que Chrome pregunta si abrir la
  aplicacion cambia el FOCO pero NO la visibilidad de la pagina. Mientras esa
  ventana esta delante, `document.hidden` es false y aqui no se cierra nada.
  No es una espera: es que la condicion no se cumple. Por eso este fichero no
  usa `blur` en ninguna parte -- `blur` SI se dispara con esa ventana, y
  tomarlo por «Maestro se abrio» cerraria la pestanya antes de que el duenyo
  confirme.

  El techo sube a 10 minutos. Con el anterior de 2 minutos, un arranque en
  frio mas una confirmacion que el duenyo tarde en atender se salia de plazo.

  No hay ningun temporizador en todo el fichero, y no hay ningun veredicto:
  la pagina dice lo que ha pasado, nunca adivina lo que no sabe.
  ============================================================================
-->
<style>
 :root{--f:#14161a;--c:#e8e8ea;--t:#2c2f36;--p:#191c21;--a:#2f6feb;--g:#9aa0a8}
 @media (prefers-color-scheme: light){
   :root{--f:#f7f7f8;--c:#17181b;--t:#dcdde0;--p:#fff;--a:#1a56d6;--g:#5d636b}}
 html,body{margin:0;background:var(--f);color:var(--c)}
 body{font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      display:grid;place-items:center;min-height:100vh;padding:16px}
 main{max-width:32em;width:100%;text-align:center}
 h1{font-size:1.25em;margin:0 0 .2em}
 p{margin:.5em 0}
 .g{color:var(--g);font-size:.9em}
 a.b,button.b{display:inline-block;margin:1em .3em 0;background:var(--a);
      color:#fff;border:0;border-radius:8px;padding:.7em 1.3em;font:inherit;
      text-decoration:none;cursor:pointer}
 button.s{background:transparent;color:var(--g);border:1px solid var(--t)}
 #e{margin-top:1.8em;font-size:.8em;color:var(--g);text-align:left;
      border-top:1px solid var(--t);padding-top:.7em;white-space:pre-line}
 code{background:var(--p);border:1px solid var(--t);padding:.1em .4em;
      border-radius:4px;font-size:.9em;word-break:break-all}
</style>
</head>
<body>
<main>
 <h1 id="t">Abriendo Maestro AI Studio&hellip;</h1>
 <p class="g" id="s">Si tu navegador pregunta si quieres abrirlo, di que s&iacute;.</p>
 <p>
   <a class="b" id="m" href="#" hidden>Abrirlo ahora</a>
   <button class="b s" id="x" hidden>Cerrar esta pesta&ntilde;a</button>
 </p>
 <div id="e" hidden></div>
</main>
<script>
"use strict";
/* ---8<--- DECISION: INICIO --- lo que se prueba, palabra por palabra ----- */
// Lista cerrada: esta pagina solo sabe formar UN tipo de enlace.
var ESQUEMA = "maestro-saoco", ACCION = "aprobar";

// Un vale: 32 hexadecimales en minuscula. Ni mas, ni menos, ni mayusculas.
var VALE = /^[0-9a-f]{32}$/;

// Consultas admitidas, comparadas ENTERAS y letra por letra. No se parsea la
// consulta y no se leen parametros: se compara la cadena completa. Por eso un
// duplicado, un parametro de propina, otro valor u otra grafia no son «lo
// mismo con algo mas»: son otra cadena, y no estan en la lista.
var CONSULTAS = ["", "?utm_source=chatgpt.com"];

function decidir(busqueda, fragmento) {
  if (CONSULTAS.indexOf(String(busqueda)) === -1) {
    return {ok: false, motivo: "consulta",
      titulo: "Ese enlace no está bien formado",
      detalle: "Lleva algo detrás de <code>?</code> que esta página no " +
               "admite. El vale va detrás de <code>#</code>: detrás de " +
               "<code>?</code> lo vería el servidor, y no debe verlo nadie."};
  }
  var vale;
  try {
    vale = decodeURIComponent(String(fragmento).replace(/^#/, "")).trim();
  } catch (e) {
    vale = "";            // un %XX mal escrito es un vale invalido, no un fallo
  }
  if (!VALE.test(vale)) {
    return {ok: false, motivo: "vale",
      titulo: "Ese enlace no lleva un vale válido",
      detalle: "Vuelve a pedirlo y usa el nuevo. Un vale son 32 caracteres " +
               "hexadecimales en minúscula, y este no lo es."};
  }
  return {ok: true, motivo: "bien", destino: ESQUEMA + "://" + ACCION + "/" + vale};
}
/* ---8<--- DECISION: FIN ------------------------------------------------- */

/* ---8<--- CIERRE: INICIO --- tambien se prueba palabra por palabra ------ */
// 250 ms: mas del triple de margen por debajo de los 791 ms mas rapidos que
// se han medido en el lanzador. Solo esta para absorber un parpadeo
// instantaneo; lo que protege la ventana de confirmacion es `oculto`.
//
// 600000 ms: diez minutos. El techo anterior de dos minutos descartaba el
// caso de un arranque en frio mas una confirmacion que tarde en atenderse.
var MINIMO = 250, MAXIMO = 600000;

function debe_cerrar(oculto, lanzado, cerrado, desde_el_lanzamiento) {
  // El orden importa. `oculto` es lo primero a proposito: la ventana con la
  // que Chrome pregunta si abrir la aplicacion cambia el foco pero NO la
  // visibilidad, asi que mientras esta delante esto devuelve false.
  if (!oculto) { return false; }
  if (!lanzado) { return false; }           // nada que acompanyar todavia
  if (cerrado) { return false; }            // una sola vez, nunca en bucle
  if (desde_el_lanzamiento < MINIMO) { return false; }
  if (desde_el_lanzamiento > MAXIMO) { return false; }
  return true;
}

// El mismo oyente se registra en `document` -- que es donde la especificacion
// dice que se dispara el evento -- y en `window`, por si algun navegador no
// lo hace burbujear. Eso significa que el mismo cambio puede llegar DOS
// veces, asi que se descarta el duplicado por su marca de tiempo. Sin esto,
// el registro de abajo contaria cada cambio dos veces y mentiria.
function repetido(marca, ultima) {
  return ultima !== null && marca === ultima;
}
/* ---8<--- CIERRE: FIN --------------------------------------------------- */

var t = document.getElementById("t"), s = document.getElementById("s"),
    m = document.getElementById("m"), x = document.getElementById("x"),
    e = document.getElementById("e");

function estado(titulo, subtitulo) {
  t.textContent = titulo;
  s.innerHTML = subtitulo;
  // El rotulo de la pestanya tambien, que en la version anterior se quedaba
  // siempre en «Abriendo...» y hacia imposible saber que habia pasado sin
  // abrir la consola.
  document.title = titulo;
}

// Registro de lo que de verdad ha ocurrido. No es un veredicto y no adivina
// nada: son los cambios de visibilidad con su instante. Si algun dia la
// pestanya no se cierra, esto dice por que de un vistazo.
var diario = [];
function apunta(linea) {
  diario.push(linea);
  e.hidden = false;
  e.textContent = "Detalle técnico:\n" + diario.join("\n");
}

var d = decidir(location.search, location.hash);

if (!d.ok) {
  estado(d.titulo, d.detalle);
  x.hidden = false;
} else {
  // El boton de respaldo es un enlace de verdad, no un guion: pulsarlo es un
  // gesto tuyo y vale siempre. Al ser un enlace no puede provocar un
  // lanzamiento doble por su cuenta.
  m.href = d.destino;
  m.hidden = false;

  var lanzado = false, cerrado = false, cuando = 0, ultima_marca = null;

  // El salto. Va aqui, al cargar, para heredar el clic con el que has
  // llegado: Chrome exige un gesto reciente y lo lleva en una bandera global
  // que tu clic acaba de poner en alto. UNA sola vez.
  lanzado = true;
  cuando = Date.now();
  try {
    location.href = d.destino;
  } catch (err) {
    apunta("el navegador no aceptó el enlace; usa el botón");
  }

  function al_cambiar_visibilidad(ev) {
    var marca = ev && typeof ev.timeStamp === "number" ? ev.timeStamp : Date.now();
    if (repetido(marca, ultima_marca)) { return; }
    ultima_marca = marca;

    var desde = Date.now() - cuando;
    apunta((document.hidden ? "pasó a oculta" : "volvió a verse") +
           " a los " + desde + " ms");

    if (!debe_cerrar(document.hidden, lanzado, cerrado, desde)) { return; }
    cerrado = true;
    // El texto y el rotulo se cambian ANTES de intentar cerrar. Si Chrome
    // permite el cierre nadie lo lee; si lo rechaza, la pagina ya dice algo
    // verdadero en vez de inventarse un diagnostico.
    estado("Maestro AI Studio está abierto",
           "Ya puedes cerrar esta pestaña.");
    x.hidden = false;
    try {
      window.close();
    } catch (err) {
      apunta("el navegador no dejó cerrar la pestaña");
    }
  }

  document.addEventListener("visibilitychange", al_cambiar_visibilidad);
  addEventListener("visibilitychange", al_cambiar_visibilidad);
}

// Cerrar a mano. Un clic lleva activacion del usuario, que es el caso en el
// que el cierre esta permitido con mas holgura; y si aun asi no se permite,
// se dice y se queda.
x.addEventListener("click", function () {
  try {
    window.close();
  } catch (err) { /* abajo */ }
  apunta("si esta pestaña sigue aquí, ciérrala con Ctrl+W");
});
</script>
</body>
</html>
