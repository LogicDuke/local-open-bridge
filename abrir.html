<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Abriendo Maestro AI Studio</title>
<!--
  ============================================================================
  PAGINA PUENTE. Sin dependencias y sin estado.

  Lo UNICO que hace: leer un vale del FRAGMENTO de la direccion, pedirle al
  navegador que abra el programa local registrado para ese tipo de enlace, y
  despues quitarse de en medio.

  Por que el fragmento (#) y no la consulta (?): el navegador NUNCA envia el
  fragmento al servidor. El alojamiento no ve el vale, no lo registra y no
  puede registrarlo.

  La consulta se compara ENTERA contra una lista cerrada de cadenas exactas
  (ver CONSULTAS). No se parsea y no se leen parametros. De ahi sale la
  garantia que importa: ninguna de las cadenas admitidas lleva un vale, asi
  que un vale sigue sin poder viajar en la consulta ni por descuido ni a
  proposito.

  Lo que esta pagina no tiene y no puede tener: ni identificadores de
  elementos, ni titulos, ni rutas de ficheros, ni sesion, ni puerto, ni
  nombres del proyecto. No carga nada de fuera -- ni tipografias, ni guiones,
  ni analitica -- asi que no hay forma de que informe a nadie de nada.

  Lo que un vale puede hacer en el ordenador de su duenyo: decidir QUE ficha
  se abre. No aprueba, no rechaza, no genera y no enciende la tarjeta
  grafica. En cualquier otro ordenador no hace nada: no hay programa
  registrado y no hay cuaderno donde buscarlo.

  ---------------------------------------------------------------------------
  SOBRE EL CIERRE AUTOMATICO, que es lo que cambia en esta version.

  La version anterior dictaba un veredicto a los 1500 ms -- «parece
  bloqueado» -- y se equivocaba casi siempre. Medido el 30 de octubre de 2026
  en el ordenador del duenyo: el lanzador tarda 1820, 3647 y 4127 ms solo en
  importar su paquete, y a eso le suma todavia 0,4 s antes de abrir el
  navegador. El umbral estaba por debajo de la medicion mas rapida, asi que
  el veredicto se dictaba mientras el lanzamiento seguia en vuelo. Ese
  diagnostico era un instrumento de medida para una prueba concreta y aqui no
  tenia nada que hacer: se ha ido entero.

  En su lugar, el cierre se dispara por VISIBILIDAD y no por tiempo. La razon
  es exacta: la ventana con la que Chrome pregunta si quieres abrir la
  aplicacion cambia el FOCO pero NO la visibilidad de la pagina. Asi que
  mientras tu decides, `document.hidden` sigue siendo false y esta pagina no
  se cierra -- no porque haya esperado lo suficiente, sino porque no se ha
  cumplido la condicion. Cuando la ficha de Maestro aparece y toma el primer
  plano, esta pagina pasa a oculta, y es justo ahi cuando sobra.

  No hay ningun temporizador en todo el fichero. El arreglo de un fallo
  causado por un temporizador no se hace con otro temporizador.
  ============================================================================
-->
<style>
 :root{--f:#14161a;--c:#e8e8ea;--t:#2c2f36;--p:#191c21;--a:#2f6feb;--g:#9aa0a8}
 @media (prefers-color-scheme: light){
   :root{--f:#f7f7f8;--c:#17181b;--t:#dcdde0;--p:#fff;--a:#1a56d6;--g:#5d636b}}
 html,body{margin:0;background:var(--f);color:var(--c)}
 body{font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      display:grid;place-items:center;min-height:100vh;padding:16px}
 main{max-width:30em;width:100%;text-align:center}
 h1{font-size:1.25em;margin:0 0 .2em}
 p{margin:.5em 0}
 .g{color:var(--g);font-size:.9em}
 a.b{display:inline-block;margin-top:1em;background:var(--a);color:#fff;
      border:0;border-radius:8px;padding:.7em 1.3em;font:inherit;
      text-decoration:none;cursor:pointer}
 code{background:var(--p);border:1px solid var(--t);padding:.1em .4em;
      border-radius:4px;font-size:.9em;word-break:break-all}
</style>
</head>
<body>
<main>
 <h1 id="t">Abriendo Maestro AI Studio&hellip;</h1>
 <p class="g" id="s">Si tu navegador pregunta si quieres abrirlo, di que s&iacute;.</p>
 <p><a class="b" id="m" href="#" hidden>Abrirlo ahora</a></p>
</main>
<script>
"use strict";
/* ---8<--- DECISION: INICIO --- lo que se prueba, palabra por palabra ----- */
// Lista cerrada: esta pagina solo sabe formar UN tipo de enlace.
var ESQUEMA = "maestro-saoco", ACCION = "aprobar";

// Un vale: 32 hexadecimales en minuscula. Ni mas, ni menos, ni mayusculas.
var VALE = /^[0-9a-f]{32}$/;

// Consultas admitidas, comparadas ENTERAS y letra por letra. No se parsea la
// consulta y no se leen parametros: se compara la cadena completa. Por eso un
// duplicado (`utm_source=chatgpt.com&utm_source=chatgpt.com`), un parametro de
// propina, otro valor u otra grafia no son «lo mismo con algo mas»: son otra
// cadena, y no estan en la lista.
//
// `?utm_source=chatgpt.com` esta aqui porque ChatGPT lo anyade al abrir el
// enlace. Si manyana anyade otra etiqueta, se escribe otra linea en esta
// lista y no hay nada mas que tocar.
var CONSULTAS = ["", "?utm_source=chatgpt.com"];

function decidir(busqueda, fragmento) {
  if (CONSULTAS.indexOf(String(busqueda)) === -1) {
    return {ok: false, motivo: "consulta",
      titulo: "Ese enlace no está bien formado",
      detalle: "Lleva algo detrás de <code>?</code> que esta página no " +
               "admite. El vale va detrás de <code>#</code>: detrás de " +
               "<code>?</code> lo vería el servidor, y no debe verlo nadie."};
  }
  var vale;
  try {
    vale = decodeURIComponent(String(fragmento).replace(/^#/, "")).trim();
  } catch (e) {
    vale = "";            // un %XX mal escrito es un vale invalido, no un fallo
  }
  if (!VALE.test(vale)) {
    return {ok: false, motivo: "vale",
      titulo: "Ese enlace no lleva un vale válido",
      detalle: "Vuelve a pedirlo y usa el nuevo. Un vale son 32 caracteres " +
               "hexadecimales en minúscula, y este no lo es."};
  }
  return {ok: true, motivo: "bien", destino: ESQUEMA + "://" + ACCION + "/" + vale};
}
/* ---8<--- DECISION: FIN ------------------------------------------------- */

/* ---8<--- CIERRE: INICIO --- tambien se prueba palabra por palabra ------ */
// Ni demasiado pronto ni para siempre.
//
// MINIMO: si la pagina se oculta en el primer instante no es porque Maestro
// haya abierto nada -- el lanzador tarda segundos -- sino porque has cambiado
// de pestanya a mano. Cerrar ahi podria llevarse por delante un lanzamiento
// todavia en vuelo, asi que no se cierra; se cerrara la siguiente vez que
// esta pagina se oculte.
//
// MAXIMO: pasado un rato, esta pestanya ya no es «la que acaba de abrir
// Maestro» sino una pestanya mas que tienes ahi. Que se cierre sola media
// hora despues, cuando mires otra cosa, seria desconcertante.
var MINIMO = 1500, MAXIMO = 120000;

function debe_cerrar(oculto, lanzado, cerrado, desde_el_lanzamiento) {
  // Ojo con el orden de las condiciones: `oculto` es la primera a proposito.
  // La ventana con la que Chrome pregunta si abrir la aplicacion cambia el
  // FOCO pero no la VISIBILIDAD, asi que mientras esa ventana esta delante
  // esto devuelve false y la pestanya no se cierra. Eso no es una espera: es
  // que la condicion no se cumple.
  if (!oculto) { return false; }
  if (!lanzado) { return false; }          // nada que acompanyar todavia
  if (cerrado) { return false; }           // una sola vez, nunca en bucle
  if (desde_el_lanzamiento < MINIMO) { return false; }
  if (desde_el_lanzamiento > MAXIMO) { return false; }
  return true;
}
/* ---8<--- CIERRE: FIN --------------------------------------------------- */

var t = document.getElementById("t"), s = document.getElementById("s"),
    m = document.getElementById("m");

var d = decidir(location.search, location.hash);

if (!d.ok) {
  t.textContent = d.titulo;
  s.innerHTML = d.detalle;
} else {
  // El boton de respaldo es un enlace de verdad, no un guión: pulsarlo es un
  // gesto tuyo y vale siempre, tambien si el salto automatico se quedo corto.
  // Al ser un enlace y no JavaScript, no puede provocar un lanzamiento doble
  // por su cuenta.
  m.href = d.destino;
  m.hidden = false;

  var lanzado = false, cerrado = false, cuando = 0;

  // El salto. Va aqui, al cargar, para heredar el clic con el que has
  // llegado: Chrome exige un gesto reciente y lo lleva en una bandera global
  // que tu clic acaba de poner en alto. UNA sola vez.
  if (!lanzado) {
    lanzado = true;
    cuando = Date.now();
    try { location.href = d.destino; } catch (e) { /* queda el boton */ }
  }

  addEventListener("visibilitychange", function () {
    if (!debe_cerrar(document.hidden, lanzado, cerrado, Date.now() - cuando)) {
      return;
    }
    cerrado = true;
    // El texto se cambia ANTES de intentar cerrar. Si Chrome permite el
    // cierre nadie lo lee, y si lo rechaza la pagina ya dice algo verdadero
    // en vez de inventarse un diagnostico.
    t.textContent = "Maestro AI Studio está abierto";
    s.innerHTML = "Ya puedes cerrar esta pestaña.";
    try { window.close(); } catch (e) { /* se queda con el mensaje de arriba */ }
  });
}
</script>
</body>
</html>
